# Local development and test services ONLY — PostgreSQL 18 alone, no Redis.
# Production is the Debian 13 LXC described in blueprint §12 — never point APP_ENV=production here.
# Values below are literal on purpose: this file reads no env var, so `docker compose up -d` works
# from any shell with no .env loaded. Port 5433 (not 5432) avoids colliding with a developer's own
# local Postgres. Image tag is pinned per blueprint §11 — bump both places together.

name: miautrix

services:
  postgres:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: miautrix_website
      POSTGRES_USER: miautrix
      POSTGRES_PASSWORD: miautrix
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U miautrix -d miautrix_website"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

volumes:
  pgdata:
