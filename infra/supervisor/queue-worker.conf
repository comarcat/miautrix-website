; infra/supervisor/queue-worker.conf — supervised `queue:work` (§9 step 27, Non-Goal #2: no
; Horizon/Redis, this supervised process is the entire queue UI/reliability story in v1).
;
; Installed by infra/provision.sh to /etc/supervisor/conf.d/queue-worker.conf. `current` is
; the atomic-cutover symlink (infra/deploy.sh) — supervisor resolves it at each process start,
; so a deploy's `supervisorctl restart queue-worker` (already in infra/deploy.sh) always picks
; up the newly-deployed release without needing this file rewritten per release.
;
; Runs as www-data (same as PHP-FPM), NOT deploy (security-auditor finding): deploy owns
; releases/ and shared/ and holds a NOPASSWD sudo grant — a job that processes untrusted
; queued input has no business running as the account that owns the deployed code and can
; reload services. www-data already only has group-write on storage/, nothing else.
[program:queue-worker]
process_name=%(program_name)s
directory=/var/www/miautrix/current
command=php /var/www/miautrix/current/artisan queue:work --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/miautrix/shared/storage/logs/queue-worker.log
stopwaitsecs=3600
