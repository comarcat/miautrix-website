name: ci

on:
  push:
    branches: [main, develop, 'task/**']
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    # Branch protection requires a check literally named "ci" (see blueprint §9 steps 2-3).
    # GitHub reports the JOB's `name:` as the check-run context, not the workflow's top-level
    # `name:` — and for ANY job using a matrix strategy, GitHub appends "(<matrix-key>)" to that
    # name regardless of an explicit override (confirmed: `name: ci` under a one-entry `php`
    # matrix still reported as "ci (8.4)", not "ci"). PHP 8.4 is a hard floor set by Pest 5, not
    # a range to test across, so there was never a reason for a matrix here — removed it and
    # hardcoded the version below instead of fighting GitHub's per-matrix-entry naming.
    name: ci
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: miautrix_test
          POSTGRES_USER: miautrix
          POSTGRES_PASSWORD: miautrix
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U miautrix -d miautrix_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30

    # Only one service container above — queue, cache, and session all use Laravel's database driver.
    env:
      APP_ENV: testing
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: miautrix_test
      DB_USERNAME: miautrix
      DB_PASSWORD: miautrix
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      SESSION_DRIVER: database

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, pgsql, mbstring, intl, gd, zip, bcmath
          coverage: none
          tools: composer:v2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Dependency audit (PHP)
        run: composer audit --format=table

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Format check
        run: ./vendor/bin/pint --test

      - name: Static analysis
        run: ./vendor/bin/phpstan analyse --no-progress

      - name: Migrate
        run: php artisan migrate --force

      - name: Install JS dependencies
        run: npm ci

      - name: Dependency audit (JS)
        run: npm audit --audit-level=high

      - name: Build assets
        run: npm run build

      - name: Assert build manifest exists
        run: test -n "$(find public/build -name manifest.json -print -quit)"

      # MUST run after the asset build: several generated auth/settings views render
      # @vite() directives, which throw ViteManifestNotFoundException on a clean checkout
      # with no public/build/manifest.json — found by an actual CI run failing here.
      - name: Tests
        run: ./vendor/bin/pest --ci
